[package]
name = "mymoney"
version = "2.0.0"
edition = "2021"
description = "Gestionnaire de patrimoine personnel auto-hébergé : tu déposes tes relevés, des adapters les lisent, tout est chiffré au repos."
license = "MIT"
publish = false

[[bin]]
name = "mymoney"
path = "src/main.rs"

[dependencies]
indexmap = "2"
regex = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
