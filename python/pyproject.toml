[project]
name = "mymoney"
version = "0.2.0"
description = "Gestionnaire de patrimoine personnel auto-hébergé : tu déposes tes relevés, des adapters les lisent, tout est chiffré au repos."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "sqlcipher3-wheels>=0.5",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "pillow>=10",
  "ofxparse>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]

[project.scripts]
mymoney = "mymoney.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mymoney*"]

[tool.setuptools.package-data]
mymoney = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
