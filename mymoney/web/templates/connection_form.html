{% extends "base.html" %}
{% block title %}{{ cls.label }}{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<p><a href="/connections/new">← Types de connexion</a></p>
<h1>{{ cls.label }}</h1>
<p class="muted">{{ cls.description }}</p>
<form method="post" class="card stack" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="connector_type" value="{{ cls.type }}">
  <label>Nom de la connexion <input name="name" value="{{ connection.name if connection else '' }}" placeholder="{{ cls.label }}"></label>
  {% for f in cls.fields %}
  <label>{{ f.label }}{% if not f.required %} <span class="muted small">(optionnel)</span>{% endif %}
    {% if f.kind == 'textarea' %}
      <textarea name="{{ f.name }}" rows="{{ 8 if 'key' in f.name else 4 }}" {% if f.required and not connection %}required{% endif %} spellcheck="false" {% if f.secret and connection %}placeholder="•••••• (laisser vide pour ne pas changer)"{% endif %}>{{ values.get(f.name, f.default) if not f.secret else '' }}</textarea>
    {% elif f.kind == 'select' %}
      <select name="{{ f.name }}">{% for v, l in f.options %}<option value="{{ v }}" {% if values.get(f.name, f.default) == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
    {% elif f.kind == 'password' %}
      <input type="password" name="{{ f.name }}" {% if f.required and not connection %}required{% endif %} autocomplete="new-password" {% if connection %}placeholder="•••••• (laisser vide pour ne pas changer)"{% endif %}>
    {% else %}
      <input name="{{ f.name }}" value="{{ values.get(f.name, f.default) }}" {% if f.required %}required{% endif %} spellcheck="false">
    {% endif %}
    {% if f.help %}<small>{{ f.help }}</small>{% endif %}
  </label>
  {% endfor %}
  <button class="btn primary">{{ 'Enregistrer' if connection else 'Enregistrer et connecter' }}</button>
</form>
{% include "connector_help.html" %}
{% endblock %}
