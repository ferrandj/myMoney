<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}myMoney{% endblock %} · myMoney</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="theme-color" content="#3b5bdb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script src="/static/app.js" defer></script>
</head>
<body>
  {% if unlocked and csrf %}
  <header class="topbar">
    <a class="brand" href="/">myMoney</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Patrimoine</a>
      <a href="/documents" {% if request.url.path.startswith('/documents') %}aria-current="page"{% endif %}>Documents</a>
      <a href="/contacts" {% if request.url.path.startswith('/contacts') %}aria-current="page"{% endif %}>Contacts</a>
      <a href="/settings" {% if request.url.path.startswith('/settings') %}aria-current="page"{% endif %}>Paramètres</a>
    </nav>
    <form method="post" action="/logout" class="lock">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="lock" value="1">
      <button type="submit" class="btn ghost" title="Efface la clé de la mémoire : plus rien n'est lisible">🔒 Verrouiller</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
