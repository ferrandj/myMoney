{% extends "base.html" %}
{% block title %}Vérification{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>{{ connection.name }}</h1>
<form method="post" class="card stack" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p>{{ prompt.message }}</p>
  {% for f in prompt.fields %}
    {% if f.kind == 'hidden' %}<input type="hidden" name="{{ f.name }}" value="{{ f.default }}">
    {% else %}<label>{{ f.label }} <input name="{{ f.name }}" {% if f.required %}required{% endif %} inputmode="numeric" autofocus></label>{% endif %}
  {% endfor %}
  <button class="btn primary">Continuer</button>
</form>
{% endblock %}
