version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # one PR per week for the minor/patch bumps; majors stay separate for review
      python-minor-and-patch:
        update-types: [minor, patch]
